name: Deploy Website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Website
        run: |
          sudo cp index.html /var/www/html/index.html
          sudo systemctl restart apache2

      - name: Verify Apache
        run: |
          sudo systemctl is-active apache2
          curl http://localhost
